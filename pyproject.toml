[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoning-recovery-probes"
version = "0.1.0"
description = "Feasibility-only Pilot P0 for saved-trajectory reasoning recovery probes"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Local research workspace" }]
dependencies = []

[project.optional-dependencies]
runtime = [
  "PyYAML>=6.0,<7",
  "datasets>=3.0,<5",
  "huggingface_hub>=0.30,<1",
  "transformers>=4.51.0,<4.53.0",
  "safetensors>=0.4",
  "accelerate>=1.0,<2",
  "math-verify[antlr4_13_2]>=0.9.0,<1",
]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
rrp = "reasoning_recovery.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
